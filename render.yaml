services:
  - type: web
    name: central-redis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          name: central-redis-store
          type: keyvalue
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

      # Required for user accounts to survive a restart. Without it the app
      # falls back to an in-memory store and every account is lost on deploy.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: central_redis

      # Comma-separated admin accounts. Everyone else is a plain user.
      - key: ADMIN_EMAILS
        sync: false

      # Optional
      # - key: LEGACY_OWNER_EMAIL  # claims migrated, ownerless projects at startup
      #   sync: false
      # - key: LIMIT_PROJECTS_PER_USER   # admins are exempt
      #   value: "1"
      # - key: SIGNUPS_ENABLED     # set to "false" to close registration
      #   value: "true"
      # - key: ENFORCE_LIMITS      # set to "true" to reject over-limit requests
      #   value: "false"
      # - key: LIMIT_PROJECTS_PER_USER
      #   value: "10"
      # - key: KEEP_ALIVE_ENABLED
      #   value: "true"

      # Legacy: projects created before user accounts existed. Each PROJECT_<ID>
      # variable still authenticates that project's API calls.
      # - key: PROJECT_MY_APP
      #   value: your-legacy-api-key

databases:
  - name: central-redis-store
    type: keyvalue
    plan: free
    region: oregon
